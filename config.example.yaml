server:
  host: "0.0.0.0"
  port: 8080

auth:
  username: "admin"
  # 使用 `app.exe -hash-password yourpassword` 生成哈希后填入
  password: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
  # API Token 认证（可选，为空则不启用）；用于 CI/CD 或脚本调用
  api_token: ""

root_dir: "C:\\Services"

# 可供前端浏览/下载的日志文件目录（固定路径，防止越权访问）；留空则不启用日志浏览
log_dir: "C:\\Services\\logs"

# URL 前缀，用于反向代理子路径部署，如 "/update-module"；留空则部署在根路径
base_path: ""

services:
  - name: "MyAppService"
    display_name: "我的应用服务"
  - name: "AnotherService"
    display_name: "另一个服务"

# ===== 多节点（CLB 后端多台服务器）配置，单机部署时可整体删除 =====
# 本节点名称，必须与下方 cluster.nodes 中某一项的 name 一致
# node_name: "node-1"
#
# cluster:
#   nodes:
#     - name: "node-1"
#       url: "http://10.0.0.11:8080"        # 内网地址，可含 base_path，如 http://10.0.0.11:8080/update
#       api_token: "node1-secret-token"     # 该节点 config.yaml 中的 auth.api_token
#     - name: "node-2"
#       url: "http://10.0.0.12:8080"
#       api_token: "node2-secret-token"

log:
  path: "logs"
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30

# 请求限流（可选，不配置则不启用）
rate_limit:
  enabled: false
  max_requests: 60    # 每分钟最大请求数
  per_ip: true        # true=按客户端 IP 限流，false=全局共享计数
