<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务更新工具</title>
<link rel="stylesheet" href="__BASE_PATH__/static/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>服务更新工具</h1>
    <div class="header-links">
      <a class="btn-link" href="__BASE_PATH__/logs">日志文件</a>
      <button class="btn-link" id="btn-logout">退出登录</button>
    </div>
  </header>

  <section class="card">
    <h2>服务状态</h2>
    <div id="services"><p class="muted">加载中...</p></div>
  </section>

  <section class="card">
    <h2>部署配置</h2>
    <label>选择服务
      <select id="service-select" required>
        <option value="">请选择服务</option>
      </select>
    </label>
    <div id="nodes-section" style="display:none">
      <div class="targets-header">
        <h3>目标节点</h3>
      </div>
      <p class="muted">按列表顺序逐个节点更新（滚动更新），单个节点失败不影响后续节点。</p>
      <div id="nodes-list"></div>
    </div>
    <div id="targets-section" style="display:none">
      <div class="targets-header">
        <h3>目标路径</h3>
        <button type="button" class="btn-sm" id="btn-add-target">添加路径</button>
        <button type="button" class="btn-sm" id="btn-save-targets">保存路径</button>
      </div>
      <p class="muted">每个目标路径对应一个部署目录（相对根目录），左侧填写服务器目录可直接执行更新，或点“替换文件”仅覆盖文件不启停服务；右侧也可上传文件。左侧会递归读取目录及子目录中的普通文件，按原有相对路径覆盖到目标路径；子目录中的 zip 在其所在目录下解压并保留包内结构，空目录不创建。勾选“是否删除原文件”后，全部节点执行成功会删除本次读取的源文件（保留目录结构），勾选状态随“保存路径”一起保存。</p>
      <div id="targets-list"></div>
      <div id="targets-status"></div>
    </div>
  </section>

  <section class="card">
    <h2>操作历史</h2>
    <div id="history"><p class="muted">加载中...</p></div>
    <div id="history-pager" class="pager"></div>
  </section>
</div>
<script>window.__BP__ = "__BASE_PATH__";</script>
<script src="__BASE_PATH__/static/app.js"></script>
</body>
</html>
